<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Details</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./problem.js" defer></script>
</head>

<body>
    <main>
        <a class="back-link" href="./index.html">Back to problems</a>
        <p id="status">Loading problem...</p>
        <!-- `problem.js` fetches problem details and populates the elements below. -->

        <section id="problem-detail" class="problem-detail" hidden>
            <div class="detail-header">
                <div>
                    <p id="problem-id" class="problem-id"></p>
                    <h1 id="problem-name"></h1>
                </div>
                <span id="difficulty"></span>
            </div>

            <section>
                <h2>Description</h2>
                <p id="description"></p>
            </section>

            <section>
                <h2>Test Cases</h2>
                <div id="test-cases" class="test-cases"></div>
            </section>

            <section>
                <h2>Submit Solution</h2>
                <form id="submission-form" class="submission-form">
                    <label for="language">Language</label>
                    <select id="language" name="language">
                        <option value="cpp">C++</option>
                        <option value="java">Java</option>
                    </select>

                    <label for="code">Code</label>
                    <textarea id="code" name="code" rows="12" placeholder="Write your solution here"></textarea>

                    <div class="submission-methods" aria-label="Submission method">
                        <!-- Submission form posts user code to backend; on success frontend redirects to submission page. -->
                        <button type="submit" name="method" value="ec2">EC2</button>
                    </div>
                </form>
                <p id="submission-status" class="submission-status"></p>
            </section>
        </section>
    </main>
</body>

</html>
